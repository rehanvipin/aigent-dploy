<!doctype html>
<html>
<head>
  <title>Aigent-Dploy Platform</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; color: #222; }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #666; margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0 2rem; table-layout: fixed; }
    td.brief { max-width: 45ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td pre { white-space: pre-wrap; word-break: break-word; margin: 0.3rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #f5f5f5; }
    .status { font-weight: 600; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.8rem; }
    .pending, .waiting { background: #e8f0fe; color: #1a56db; }
    .escalated { background: #fef3c7; color: #b45309; }
    .done, .achieved { background: #d1fae5; color: #047857; }
    .failed, .abandoned { background: #fee2e2; color: #b91c1c; }
    .active { background: #e8f0fe; color: #1a56db; }
    .card { border: 1px solid #fbbf24; background: #fffbeb; border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; overflow-wrap: break-word; }
    .card pre { white-space: pre-wrap; word-break: break-word; margin: 0.4rem 0; }
    .card input { max-width: 100%; box-sizing: border-box; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Platform dashboard</a>
    <a href="/cms/board">CMS task board (stub)</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
